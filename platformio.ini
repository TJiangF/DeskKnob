; DeskKnob - ESP-IDF (PlatformIO)
;
; This project uses the native ESP-IDF component system:
;   - application component : main/  (src_dir = main, see [platformio])
;   - local components      : components/<name>
;   - registry components   : managed_components/ (pulled by idf_component.yml)
;
; It can be built either with PlatformIO (`pio run`) or with the native
; ESP-IDF toolchain (`idf.py build`). Both use the ESP-IDF CMake build.

[platformio]
src_dir = main

[env:esp32-s3-devkitm-1]
platform = espressif32
board = esp32-s3-devkitm-1
framework = espidf

; ---- serial ----
; Port is auto-detected by PlatformIO. If several ports exist, set it here,
; e.g. monitor_port = /dev/cu.wchusbserial1140
upload_speed = 460800
monitor_speed = 115200

; ---- build ----
build_flags =
	-DDESKKNOB_ESPIDF=1
board_build.esp-idf.overwrite_managed_components = yes
board_build.partitions = partitions.csv
